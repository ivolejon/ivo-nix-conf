[terminal]
default_shell = "zsh"

[theme]
auto_switch = true

[keys]
prefix = "ctrl+s"
split_horizontal = "prefix+minus"
split_vertical = "prefix+backslash"
new_tab = "prefix+t"
new_workspace = "prefix+n"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_right = ["prefix+l", "prefix+right"]
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[ui]
agent_panel_sort = "spaces"
